[project]
name = "arpenteur"
version = "0.1.0"
description = "Market surveying for Swiss SMEs from public sources"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "anthropic>=0.40",
]

[project.scripts]
arpenteur = "arpenteur.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arpenteur"]
