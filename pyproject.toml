[project]
name = "arpenteur"
version = "0.1.0"
description = "Survey a market from the Swiss public register"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "anthropic>=0.40",
    # The console. Server-rendered HTML with HTMX from a CDN, so there is no
    # JavaScript build step and no node_modules; these two are the whole of it.
    "fastapi>=0.115",
    "uvicorn>=0.32",
    # Form posts and file uploads from the console. FastAPI needs it for
    # Form(...) and UploadFile.
    "python-multipart>=0.0.9",
    # Text out of the PDFs a client sends. Pure Python, no system libraries and
    # no build step, which is the whole reason it is this one: the alternatives
    # want poppler or MuPDF on the machine.
    "pypdf>=5.1",
    "psycopg[binary,pool]>=3.2",
    # Notes are written in Markdown, in whatever editor the operator already
    # uses, and rendered by the console. CommonMark has more corners than it
    # looks (nested lists above all), and a hand-rolled renderer that gets one
    # wrong quietly mangles somebody's own writing. This one is pure Python,
    # needs no build step, and escapes raw HTML by default, which is the
    # property that matters when the result is put on a page.
    "markdown-it-py>=3.0",
    # The Swiss QR Code on an invoice's payment part. Pure Python with no
    # dependencies of its own and no build step, which is why it is this one:
    # the alternatives want Pillow, and the PDF libraries that would have
    # rendered the whole bill want cairo and pango on the machine. The document
    # is printed from the browser instead, so this is the only piece that
    # genuinely could not be drawn by hand.
    "segno>=1.6.6",
    "dnspython>=2.7",
]

[project.scripts]
arpenteur = "arpenteur.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arpenteur"]
