[project]
name = "arpenteur"
version = "0.1.0"
description = "Survey a market from the Swiss public register"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "anthropic>=0.40",
    # The console. Server-rendered HTML with HTMX from a CDN, so there is no
    # JavaScript build step and no node_modules; these two are the whole of it.
    "fastapi>=0.115",
    "uvicorn>=0.32",
    # Form posts and file uploads from the console. FastAPI needs it for
    # Form(...) and UploadFile.
    "python-multipart>=0.0.9",
    # Text out of the PDFs a client sends. Pure Python, no system libraries and
    # no build step, which is the whole reason it is this one: the alternatives
    # want poppler or MuPDF on the machine.
    "pypdf>=5.1",
    "psycopg[binary,pool]>=3.2",
]

[project.scripts]
arpenteur = "arpenteur.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arpenteur"]
