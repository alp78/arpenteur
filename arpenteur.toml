# Arpenteur configuration. Everything that varies between surveys lives here
# rather than in code: the territory, the legal forms worth sweeping, and the
# sectors and segments the profile stage sorts companies into.

# Which modules this deployment runs. Each owns its own Postgres schema and
# its own migrations, and nothing upstream holds a foreign key into anything
# downstream, so removing one cannot orphan a row in another.
#
#   scout    the survey: register sweep, detail, officers, segments, website
#            research, scoring. Owns core and intel. Cannot be disabled;
#            everything else is downstream of it.
#   geo      establishments with coordinates, cantonal boundaries, the map.
#   clients  client records, projects, the interaction log, the dossier, the
#            suggested approach, interview preparation.
#   sales    service catalogue, rate cards, quotes, invoices, time entries.
#            Requires clients.
#   analytics  views over everything else: the funnel and its cycle times,
#            conversion by band, what each stage cost, the pipeline and what
#            is outstanding. Written to by nothing, so removing it loses no
#            data at all.
#
# Removing a name here stops the module loading. `arpenteur modules drop <name>`
# also deletes its schema, which is not reversible without a backup.
[modules]
enabled = ["scout", "geo", "clients", "sales", "analytics"]

[survey]
# The territory. Name a region from [regions] below, or set `cantons`
# directly; `cantons` wins if both are given, and --region or --canton on the
# command line overrides either.
#
# The territory is not only what gets swept. It is also what the sync stage
# admits: a company registered inside it is added when its first FOSC notice
# appears, so new incorporations arrive without ever re-sweeping, and one
# registered outside it is counted and discarded.
region = "romandie"

# Which legal forms to sweep and admit, as the catalogue's own eCH-0097 uid
# codes rather than its short names: the short name for a Sàrl carries a
# grave accent, and matching on it made the sweep depend on that accent
# surviving every config edit and shell round trip.
#
# Run `arpenteur legal-forms` for the catalogue, resolved live and marking
# the ones this survey uses. The common codes:
#   0101  Entreprise individuelle      0109  Association
#   0103  Société en nom collectif     0110  Fondation
#   0106  Société anonyme              0111  Succursale étrangère
#   0107  Société à responsabilité l.  0151  Succursale
#   0108  Société coopérative          0117  Institut de droit public
#
# One consideration when choosing, rather than a recommendation. A 0101 is
# registered in a natural person's own name, so its entry is personal data in
# a way a company's is not, and a campaign addressing sole traders carries
# obligations under the nLPD (and the GDPR, for anyone applying this outside
# Switzerland) that a campaign addressing legal entities does not. Include
# them or not according to what the survey is for; the tool does not decide.
legal_forms = ["0107", "0106", "0101"]

# Whether the sync stage may add companies it has never seen, when they fall
# inside the territory above. Left on, new incorporations arrive with their
# first FOSC notice and the map keeps itself current without a re-sweep.
# Turned off, the survey stays exactly the set the sweep found.
admit_new = true

# Register states worth spending on. A company that has been struck off or is
# winding up stays in the database, because its departure is a fact and
# deleting the row would take its notices and any notes with it, but the
# stages that cost money skip it. Measured on 11.08.2026: 11'121 of 183'392
# companies here were BEING_CANCELLED or CANCELLED, 6% of the survey.
# Set to [] to work the whole register regardless of state.
statuses = ["ACTIVE"]

# Named territories, so a survey can be scoped without editing a canton list
# by hand. Add your own freely: nothing here is special to the code.
[regions]
# The six French-speaking cantons, JU included (decision of 2026-08-13:
# the whole Suisse romande is in scope, everywhere cantons are named).
romandie = ["GE", "VD", "FR", "NE", "VS", "JU"]
geneve = ["GE"]
vaud = ["VD"]
arc-lemanique = ["GE", "VD"]
suisse = [
    "AG", "AI", "AR", "BE", "BL", "BS", "FR", "GE", "GL", "GR", "JU", "LU",
    "NE", "NW", "OW", "SG", "SH", "SO", "SZ", "TG", "TI", "UR", "VD", "VS",
    "ZG", "ZH",
]

# The language regions, for a campaign that writes to each company in its own
# language. A canton is placed by its majority language, which is an
# approximation and is wrong at four known edges: Bern is German-speaking with
# a French Jura bernois, Fribourg and Valais are officially bilingual with
# German minorities, and Grisons is trilingual.
#
# Romansh cannot be selected this way at all. It is spoken by a minority of one
# canton, in named valleys, so `romanche` below is Grisons entire and is a
# starting point rather than an answer: the register stores each company's
# `legal_seat`, which is a commune, and that is the column a real Romansh list
# would be built from.
suisse-romande = ["GE", "VD", "FR", "NE", "VS", "JU"]
suisse-alemanique = [
    "AG", "AI", "AR", "BE", "BL", "BS", "GL", "GR", "LU", "NW", "OW", "SG",
    "SH", "SO", "SZ", "TG", "UR", "ZG", "ZH",
]
suisse-italienne = ["TI"]
romanche = ["GR"]

[zefix]
base_url = "https://www.zefix.admin.ch/ZefixPublicREST"
# Requests per second. The registry is a public service run for everyone;
# 2/s finishes a canton in minutes and is invisible to them.
rate_limit = 2.0
max_retries = 4
# No page_cap: measured on 11.08.2026, the registry does not truncate. It
# answers a search in full (4874 rows was the largest observed) or refuses it
# with 400 RESULTLIST_TO_LARGE, and the sweep narrows the prefix on refusal.
contact = "arpenteur (contact: alexis@peringer.ch)"

[llm]
provider = "anthropic"
# How the model is paid for, and it is a choice of transport rather than of
# credential. A Claude plan cannot pay for the Messages API and API credit
# cannot be drawn from a plan, so the two modes take different roads:
#
#   subscription the Claude Code CLI (`claude -p`), spending plan quota. Needs
#                `npm install -g @anthropic-ai/claude-code` and one sign-in.
#                Slower — a search is tens of seconds — and costs no money.
#   api_key      the Messages API, billed per token to ANTHROPIC_API_KEY.
#                Faster and parallel, and the right answer for a server.
#   auto         subscription if the CLI is installed and signed in, otherwise
#                the API key.
#
# Set to the subscription deliberately: the address cascade's search tier runs
# once per company over thousands of companies, and on the API that is a bill
# rather than a wait.
auth_mode = "subscription"
classify_model = "claude-haiku-4-5"
draft_model = "claude-sonnet-5"
# The enrich stage searches and reads the open web through Anthropic's hosted
# tools. Those need a model in the Opus 4.6+ or Sonnet 4.6+ family, so the
# cheap classifier above cannot run this stage.
enrich_model = "claude-sonnet-5"
# Bounds per company. Each search is billed, so this is the cost dial: four
# searches is enough to find a Swiss SME's site and read its main pages.
enrich_max_searches = 4

# Seconds one subscription call may take. Raised from 300 on 07.10.2026,
# when a company lookup in the address hunt was measured still running at
# 290s and recording a timeout instead of an address.
subscription_timeout = 600
enrich_max_tokens = 8000
# The match stage reads campaign.md and one company's whole file together and
# takes a position on it. Judgement rather than extraction, so not the cheap
# classifier; no web access, so no server-tool requirement either.
match_model = "claude-sonnet-5"
match_max_tokens = 4000
# The advise stage arbitrates: it reads a client's whole dossier, their own
# documents and the rate card, and says what to raise, what to offer and what
# it costs. That is the hardest judgement this tool makes and the one whose
# output gets repeated out loud to a client, so it gets the strongest model at
# a high effort. Effort is how much the model thinks before answering:
# low | medium | high | xhigh | max, empty for the model's own default.
advise_model = "claude-opus-5"
advise_effort = "xhigh"
# Thinking tokens count against max_tokens, so raising effort means raising
# this. Measured 12.08.2026 at effort unset: a ten-section dossier with one
# 21'000-character document overran 8000 and needed 16000. xhigh needs more
# again.
advise_max_tokens = 32000

# The prep stage extracts every term, acronym, technology and topic in a
# client's file and writes the material to revise before the meeting. Recall
# and organisation rather than judgement, over material that is already in
# front of it, so it does not need the arbitration model and would be slow and
# expensive on it.
prep_model = "claude-sonnet-5"
prep_max_tokens = 48000
# Companies per classification call. Larger batches are cheaper per company
# and degrade accuracy once the prompt gets long.
batch_size = 20

[enrich]
# What counts as a signal, in your own words. The enrich stage reads a
# company's website and returns a `signals` list; this sentence is the whole
# of what it is looking for, so it is the difference between a survey that
# scouts for IT work, one that scouts for hiring, and one that scouts for
# distribution partners.
#
# Keep it concrete and enumerate examples: the model is better at "hiring for
# technical roles" than at "digital maturity".
#
# It must ask for the evidence campaign.md judges on, including the evidence
# that argues *against* approaching. A named IT partner is the brief's first
# warn-off, and if this sentence does not ask enrich to record one, match
# never sees it: the research is the only place that fact can come from.
signal_brief = """
Evidence bearing on a need for independent IT, data or AI work: an ageing or \
absent website; processes described as manual, on paper, or re-keyed between \
tools; several business systems that clearly do not talk to each other \
(till, accounting, stock, CRM, scheduling); reporting or figures compiled by \
hand; compliance, professional secrecy or personal-data obligations; \
substantial data from measurement, laboratory, logistics or production work; \
hiring for technical roles; growth, new sites or recent expansion. \
Record equally the evidence against approaching: an IT provider or managed \
service partner named on the site, an internal technical team or IT \
director, and any sign the company itself sells IT services or resells \
hardware and licences.
"""

# Who is billing, as it must appear on an invoice and in the payment part of a
# Swiss QR-bill. This is not a secret and belongs in the committed file: every
# one of these values is printed on documents that go to clients.
#
# `iban` decides the shape of the payment reference on its own. An IBAN whose
# institution number falls in the reserved 30000-31999 range is a QR-IBAN and
# takes a 27-digit QR reference; an ordinary IBAN takes an ISO 11649 creditor
# reference beginning RF. Arpenteur works out which and refuses the mismatched
# combinations, because a QR-bill built the wrong way prints perfectly, scans
# perfectly, and is rejected at the bank.
#
# `vat_number` empty means not subject to TVA, which is the ordinary state of a
# business under the CHF 100'000 threshold. Invoices then carry no tax line and
# say so in words, rather than showing 0.00 beside a rate.
# How the six parts of a score are weighed against each other.
#
# A score is not one number any more. Fit, need, timing and value are judged by
# the model against the campaign brief; reach and relationship are counted from
# the contacts and the officer graph, because they are facts this database
# already holds and a model asked to guess at them will produce a number
# anyway.
#
# These are a campaign's opinion, not a constant. A campaign selling to whoever
# will answer weights reach heavily; one selling a six-figure programme weights
# value and ignores it. The numbers need not sum to anything: they are
# renormalised, so "twice as much as the others" can be written as a 2.
#
# `arpenteur weights load` opens a new version rather than editing the one in
# force, because a re-weighting must not rewrite what last month's ranking was
# and every score cites the set it was computed with.
[scoring]
name = "starting point"
note = "Fit and need lead: a campaign that gets those wrong wastes every call."

[scoring.weights]
icp_fit = 0.30
need = 0.25
timing = 0.15
value = 0.10
reach = 0.10
relationship = 0.10

[issuer]
name = "Alexis Peringer"
street = "Chemin du Trabandan"
building = "17"
postcode = "1006"
town = "Lausanne"
country = "CH"
# Compte BCV du mandat. IBAN ordinaire, institution 00767 : la partie paiement
# prend une référence RF ou aucune, jamais une référence QR.
iban = "CH25 0076 7000 R570 7595 3"
# Vide tant que l'assujettissement n'a pas commencé, ce qui fait écrire
# l'exonération en toutes lettres plutôt qu'un taux de zéro.
vat_number = ""
# Printed under the total. Payment terms, and anything a client's accounts
# payable department needs in order to pay without telephoning.
payment_terms = "Payable within 30 days."
# Days from the issue date to the due date, used when nothing else is said.
payment_days = 30

[rates]
# What the work costs, in your own words. The advise stage reads this when it
# suggests an approach to a client, and it is forbidden to price anything this
# does not cover.
#
# That constraint is the reason this section exists. A model asked what a Swiss
# IT diagnostic costs will produce a confident four-figure number from nowhere,
# and the first time that number is repeated to a client it stops being a
# suggestion and becomes a commitment. Prices have to come from you.
#
# Leaving it empty is a legitimate choice: the advice then comes back with the
# work identified and no prices on it, which is honest. Editable from Settings
# in the console.
#
# Write it however you actually quote. Name the unit (day, package, month),
# give a range where you quote a range, and say what moves a price inside it.
card = """
One rate governs this whole card: CHF 86 an hour, and a day means eight hours, \
so CHF 688. Every fixed fee below is a number of hours at that rate and \
nothing else. A client who divides any fixed fee by its stated hours finds \
CHF 86 every time.
Hourly rate, time and materials: CHF 86, billed on the quarter hour against a \
statement of actual time. Used where the volume cannot be fixed in advance.
Day rate, time and materials: CHF 688, being eight hours.
Diagnostic, fixed fee. 2 to 4 days on site, 16 to 32 hours: inventory of \
systems, mapping of flows, written report and a prioritised list. CHF 1'376 to \
CHF 2'752 depending on the number of sites and systems. This is the usual way in.
Document review, fixed fee: CHF 4'816, being 7 days or 56 hours. Critical \
review of a body of documents the client has produced, with the annexes \
cross-checked against each other, written findings, and the corrections \
carried into their document ready to issue.
Attendance at a session, fixed fee: CHF 516 per occurrence, being 6 hours of \
preparation, travel and the session itself. One board, management committee or \
supplier hearing, no written deliverable.
Second opinion on a supplier's proposal, fixed fee: CHF 688 to CHF 1'376, \
being one to two days.
Implementation, fixed fee, quoted only after a diagnostic: CHF 8'256 to \
CHF 41'280, being 12 to 60 days. Never quoted before the diagnostic is done.
Retainer, monthly: CHF 1'376 to CHF 3'440, being 2 to 5 days a month reserved, \
minimum six months, for ongoing custody of a data platform or standing \
advisory to a management team. Unused hours do not carry over.
Travel inside the surveyed cantons is not billed. Nothing is billed before a \
written order.
"""

# The segments. Each is a filter a survey can be sliced by, and the
# definitions below are the prompt: keep them one line, concrete, and
# mutually distinguishable, because the classifier sees nothing else. These
# are an example vocabulary, not a fixed one. Rewrite them for the campaign
# at hand; a recruiter's segments and a distributor's have nothing in common.
# The same card as rows, which is what quotes and invoices are built from.
#
# The prose above is what the advise stage reads when this list is empty, and
# it stays for that reason: a survey that has not set up a catalogue should
# still get advice with honest prices on it. Once these entries exist,
# `arpenteur rates load` puts them in the database, the advise stage prices
# from them instead, and a quote line can cite the card line it came from.
#
# `unit` is fixed, day, month or hour, and decides how a quote line multiplies
# out. `low` and `high` are a range because that is how the work is actually
# quoted; `basis` says what moves a price inside it, which otherwise lives only
# in the operator's head. Leave both empty for price on application.
#
# These figures are the ones written in the prose card above, restated. Nothing
# here is a suggestion from the tool: prices come from you, and a model asked
# what a Swiss consulting day costs will produce a confident number from
# nowhere.
[[rates.service]]
code = "diagnostic"
name = "Diagnostic"
unit = "fixed"
low = 1376
high = 2752
what = "Two to four days on site: inventory of systems, mapping of flows, written report and a prioritised list. Sixteen to thirty-two hours."
basis = "The number of sites and systems, counted in hours at the hourly rate."
sort_order = 10

[[rates.service]]
code = "hour"
name = "Hourly rate, time and materials"
unit = "hour"
low = 86
high = 86
what = "Work whose volume cannot be fixed in advance, billed on the quarter hour against a statement of actual time."
basis = "One rate, whatever the work. A range on an hourly line invites an argument about which end applies after the hours are spent."
sort_order = 15

[[rates.service]]
code = "day"
name = "Day rate, time and materials"
unit = "day"
low = 688
high = 688
what = "Eight hours at the hourly rate, for work planned as whole days."
basis = "Eight times the hourly rate exactly. Every other line on this card is hours at that same rate, so no client finds two prices for one hour of the same work."
sort_order = 20

[[rates.service]]
code = "implementation"
name = "Implementation"
unit = "fixed"
low = 8256
high = 41280
what = "Fixed fee, quoted only after a diagnostic. Twelve to sixty days, which is ninety-six to four hundred and eighty hours."
prerequisite = "A completed diagnostic. Never quoted before."
basis = "Scope, converted into hours at the hourly rate."
sort_order = 30

[[rates.service]]
code = "retainer"
name = "Retainer"
unit = "month"
low = 1376
high = 3440
what = "Ongoing custody of a data platform, or standing advisory to a management team. Two to five days a month, which is sixteen to forty hours."
prerequisite = "Minimum six months."
basis = "The hours reserved each month, at the hourly rate. Unused hours do not carry over."
sort_order = 40

[[rates.service]]
code = "second-opinion"
name = "Second opinion on a supplier's proposal"
unit = "fixed"
low = 688
high = 1376
what = "One to two days, which is eight to sixteen hours."
basis = "The length of the proposal and whether a written note is wanted, counted in hours at the hourly rate."
sort_order = 50

[[rates.service]]
code = "document-review"
name = "Document review"
unit = "fixed"
low = 4816
high = 4816
what = "Critical review of a body of documents the client has produced: cross-checking the annexes against each other, written findings, and the corrections carried into their own document ready to issue. Seven days, which is fifty-six hours."
basis = "The number of pieces in the file and the number of arbitrations the client asks to have settled, counted in hours at the hourly rate."
sort_order = 60

[[rates.service]]
code = "session"
name = "Attendance at a session"
unit = "fixed"
low = 516
high = 516
what = "One board, management committee or supplier hearing: attendance, technical questions answered on the spot, no written deliverable. Six hours, covering preparation, travel and the session itself."
basis = "Per occurrence. A session running long is billed at the hourly rate for the excess rather than re-quoted."
sort_order = 70

[rates.card_note]
text = "Travel inside the surveyed cantons is not billed. Nothing is billed before a written order."

# How a company fits a campaign. Several at once is normal and expected: a
# regulated laboratory is both compliance-sector and data-driven, and forcing
# one label would throw away the more interesting half. These definitions are
# the classifier's prompt word for word, so they are the whole of what it knows.
[segments]
sme-owner = "A small owner-run business, typically under 50 people, where the owner decides."
mature-sme = "An established firm, long registered, with structured operations and likely several sites or departments."
data-driven = "Work that produces or depends on substantial data: analytics, laboratories, logistics, finance, research."
ai-adopter = "Purpose text mentions software, automation, digital products or AI as part of what the company does."
compliance-sector = "Regulated activity: health, finance, insurance, legal, public mandates, personal data at the centre."
lean-startup = "Recently registered, small capital, product or technology purpose rather than trade or services."

# Who performs a flat handover, graded by how central it is to the business.
# The distinction that matters is managing property for somebody else: a firm
# that administers buildings runs an entry and an exit inspection on every
# tenancy, a broker sees one at a sale, and a company that merely owns a
# building has its agency do them.
regie-core = "The registered purpose names management of property for third parties: gérance, administration d'immeubles, Liegenschaftsverwaltung, Bewirtschaftung, amministrazione di immobili."
regie-letting = "Lets property without naming management: location, Vermietung, locazione. Hands flats over, but administration may sit elsewhere."
regie-brokerage = "Brokerage, sale or development only: courtage, promotion, Vermittlung, Makler. Sees a handover occasionally rather than weekly."
regie-owner = "Holds or invests in property and names no management or letting activity. The handovers happen, but an agency runs them."

# What line of business a company is in, which is a different question from how
# it fits a campaign. Exactly one per company, chosen from this list and never
# invented, so `restaurants in Vaud` is a filter rather than a search for the
# word "restaurant" in a purpose text that says "exploitation d'établissements
# publics".
#
# One is a floor, not a target: the same classify call that applies the
# segments above picks the sector, so a longer list costs a few output tokens
# and no extra pass. Rename them, merge them, split them; the vocabulary is
# closed only in the sense that the classifier may not step outside whatever is
# written here. Editing this list and re-running with 're-label' re-sorts the
# survey, and sectors set by hand in the console are never overwritten.
#
# Loosely the top level of NOGA, with the parts a Swiss SME survey actually
# distinguishes split out: holdings apart from finance because a large share of
# SA and Sàrl purposes are pure participation vehicles and would otherwise
# swamp the finance bucket, engineering apart from consulting because the
# `bureau d'ingénieurs` is a different customer from the `conseil en gestion`.
[sectors]
agriculture = "Farming, viticulture, forestry, horticulture, fishing, and the first processing of what they produce."
construction = "Building and civil works, and the trades on site: masonry, carpentry, roofing, plumbing, heating, electrical installation, painting, renovation."
manufacturing = "Making physical goods: production, machining, assembly, workshop and industrial processing, food production."
energy-environment = "Electricity, heating, water, waste, recycling, remediation, environmental services."
wholesale-trade = "Buying and selling goods to businesses: import, export, distribution, trading, representation."
retail = "Selling goods to the public, in a shop or online."
hospitality = "Restaurants, cafés, bars, catering, hotels, guest accommodation, tourism."
transport-logistics = "Carrying goods or people, freight forwarding, warehousing, delivery, removals, taxi and coach."
it-services = "Software, IT services, hosting, networks, data, artificial intelligence, electronics and telecoms engineering."
engineering = "Technical design offices: architecture, civil, mechanical and electrical engineering, surveying, laboratory and testing work."
marketing-media = "Advertising, communication, graphic and web design, publishing, audiovisual production, events, public relations."
finance = "Banking, credit, asset and fund management, insurance and its broking, payment and financial services."
holding = "Acquisition, holding and management of participations in other companies, and management of the group's own assets. The purpose describes owning rather than operating."
real-estate = "Owning, letting, managing, brokering or developing property."
legal-accounting = "Law, notarial work, fiduciary and accounting services, audit, tax and payroll administration."
consulting = "Advice and services to businesses that are none of the above: management, strategy, organisation, human resources, recruitment, training of staff, administrative support."
health-care = "Medical, dental, veterinary and paramedical practice, therapy, care homes, home care, pharmacies, medical analysis."
education = "Schools, teaching, vocational and language training, coaching, childcare."
personal-services = "Services to individuals: hairdressing, beauty, wellbeing, cleaning, security, repair, funeral services, domestic work."
non-profit = "An association, foundation or cooperative whose purpose is charitable, cultural, sporting, religious, professional or otherwise not for profit."
other = "The purpose text does not place the company in any sector above, or describes something too general to place."

# What a tester-enrolment message carries that a model must never write.
#
# A URL a model produces is a URL a model invented, and a plausible, well-formed
# TestFlight link that goes nowhere is worse than no link: the recipient tries
# it once and files the message as a scam. The dates are here for the same
# reason. Google counts its twelve testers across one continuous window, so
# every recipient has to be given the same two dates, and a model asked for
# "a fortnight" supplies a different fortnight each time.
[enrol]
# The first invitation asks for a reply. Installation details are given after
# interest is expressed; do not append them to the initial message.
include_in_draft = false
# Which bands the campaign writes to, when --segment names none. regie-core is
# the band whose registered purpose names managing property for third parties,
# while a regie-letting company may delegate handovers to another firm.
segments = ["regie-core"]
# The programme whose cards this campaign moves. `arpenteur programme
# list` names the ones that exist.
programme = "LIMEN"
ios_link = ""
android_window_start = ""
android_window_end = ""
android_testers = 12
android_days = 14

[smtp]
# The send half. Host, port, user and password come from .env (SMTP_SERVER,
# SMTP_PORT, SMTP_USERNAME, SMTP_PASSWORD, SMTP_SECURITY), falling back to the
# INFOMANIAK_* names and then to the IMAP credentials, so one mailbox at one
# host needs nothing added here.
# Port 587 wants starttls, port 465 wants ssl.
security = "starttls"
sender_name = "Alexis Peringer"
# Empty asks the server what it calls its Sent folder.
sent_folder = ""
# How many messages one run may post. A review limit before a politeness one.
per_run = 25
# An HTML fragment appended to every message, below a thin rule. Edit it at
# /signature in the console, or write the file by hand.
signature_file = "signature.html"
