# Arpenteur configuration. Everything that varies between surveys lives here
# rather than in code: the territory, the legal forms worth sweeping, and the
# segments the profile stage sorts companies into.

[survey]
# The territory. Name a region from [regions] below, or set `cantons`
# directly; `cantons` wins if both are given, and --region or --canton on the
# command line overrides either.
#
# The territory is not only what gets swept. It is also what the sync stage
# admits: a company registered inside it is added when its first FOSC notice
# appears, so new incorporations arrive without ever re-sweeping, and one
# registered outside it is counted and discarded.
region = "romandie"

# Which legal forms to sweep and admit, as the catalogue's own eCH-0097 uid
# codes rather than its short names: the short name for a Sàrl carries a
# grave accent, and matching on it made the sweep depend on that accent
# surviving every config edit and shell round trip.
#
# Run `arpenteur legal-forms` for the catalogue, resolved live and marking
# the ones this survey uses. The common codes:
#   0101  Entreprise individuelle      0109  Association
#   0103  Société en nom collectif     0110  Fondation
#   0106  Société anonyme              0111  Succursale étrangère
#   0107  Société à responsabilité l.  0151  Succursale
#   0108  Société coopérative          0117  Institut de droit public
#
# One consideration when choosing, rather than a recommendation. A 0101 is
# registered in a natural person's own name, so its entry is personal data in
# a way a company's is not, and a campaign addressing sole traders carries
# obligations under the nLPD (and the GDPR, for anyone applying this outside
# Switzerland) that a campaign addressing legal entities does not. Include
# them or not according to what the survey is for; the tool does not decide.
legal_forms = ["0107", "0106", "0101"]

# Whether the sync stage may add companies it has never seen, when they fall
# inside the territory above. Left on, new incorporations arrive with their
# first FOSC notice and the map keeps itself current without a re-sweep.
# Turned off, the survey stays exactly the set the sweep found.
admit_new = true

# Named territories, so a survey can be scoped without editing a canton list
# by hand. Add your own freely: nothing here is special to the code.
[regions]
# The five French-speaking cantons. JU is left out by default: it is small
# and its economy points north to Basel rather than to the lake.
romandie = ["GE", "VD", "FR", "NE", "VS"]
romandie-ju = ["GE", "VD", "FR", "NE", "VS", "JU"]
geneve = ["GE"]
vaud = ["VD"]
arc-lemanique = ["GE", "VD"]
suisse = [
    "AG", "AI", "AR", "BE", "BL", "BS", "FR", "GE", "GL", "GR", "JU", "LU",
    "NE", "NW", "OW", "SG", "SH", "SO", "SZ", "TG", "TI", "UR", "VD", "VS",
    "ZG", "ZH",
]

[zefix]
base_url = "https://www.zefix.admin.ch/ZefixPublicREST"
# Requests per second. The registry is a public service run for everyone;
# 2/s finishes a canton in minutes and is invisible to them.
rate_limit = 2.0
max_retries = 4
# No page_cap: measured on 11.08.2026, the registry does not truncate. It
# answers a search in full (4874 rows was the largest observed) or refuses it
# with 400 RESULTLIST_TO_LARGE, and the sweep narrows the prefix on refusal.
contact = "arpenteur (contact: alexis@peringer.ch)"

[llm]
provider = "anthropic"
# How the model is paid for.
#   auto         an ANTHROPIC_API_KEY if one is set, otherwise a local Claude
#                sign-in (ant auth login). The sensible default when published.
#   subscription only the local sign-in. Never touches an API key, even if one
#                is present in the environment.
#   api_key      only ANTHROPIC_API_KEY. Right for a server, where falling back
#                to whatever profile the deploy user happens to have would be
#                a surprise.
auth_mode = "auto"
classify_model = "claude-haiku-4-5"
draft_model = "claude-sonnet-5"
# The enrich stage searches and reads the open web through Anthropic's hosted
# tools. Those need a model in the Opus 4.6+ or Sonnet 4.6+ family, so the
# cheap classifier above cannot run this stage.
enrich_model = "claude-sonnet-5"
# Bounds per company. Each search is billed, so this is the cost dial: four
# searches is enough to find a Swiss SME's site and read its main pages.
enrich_max_searches = 4
enrich_max_tokens = 8000
# Companies per classification call. Larger batches are cheaper per company
# and degrade accuracy once the prompt gets long.
batch_size = 20

[enrich]
# What counts as a signal, in your own words. The enrich stage reads a
# company's website and returns a `signals` list; this sentence is the whole
# of what it is looking for, so it is the difference between a survey that
# scouts for IT work, one that scouts for hiring, and one that scouts for
# distribution partners.
#
# Keep it concrete and enumerate examples: the model is better at "hiring for
# technical roles" than at "digital maturity". The example below is a
# consultancy looking for firms that might need IT work; replace it.
signal_brief = """
Evidence bearing on a need for IT or digital work: an ageing or absent \
website, processes described as manual or paper-based, hiring for technical \
roles, named systems in use, compliance or data-handling obligations, growth \
or new sites.
"""

# The segments. Each is a filter a survey can be sliced by, and the
# definitions below are the prompt: keep them one line, concrete, and
# mutually distinguishable, because the classifier sees nothing else. These
# are an example vocabulary, not a fixed one. Rewrite them for the campaign
# at hand; a recruiter's segments and a distributor's have nothing in common.
[segments]
sme-owner = "A small owner-run business, typically under 50 people, where the owner decides."
mature-sme = "An established firm, long registered, with structured operations and likely several sites or departments."
data-driven = "Work that produces or depends on substantial data: analytics, laboratories, logistics, finance, research."
ai-adopter = "Purpose text mentions software, automation, digital products or AI as part of what the company does."
compliance-sector = "Regulated activity: health, finance, insurance, legal, public mandates, personal data at the centre."
lean-startup = "Recently registered, small capital, product or technology purpose rather than trade or services."
